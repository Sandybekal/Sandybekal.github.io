<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mood Tracker</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #ffeef0;
      overflow-x: hidden;
    }

    h1 {
      text-align: center;
      margin-top: 30px;
      color: #d6336c;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      padding: 20px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
      position: relative;
      z-index: 2;
    }

    label {
      display: block;
      margin: 15px 0 5px;
      font-weight: bold;
    }

    input[type="range"] {
      width: 100%;
    }

    textarea {
      width: 100%;
      height: 100px;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #ccc;
      resize: none;
    }

    .smash-button {
      display: block;
      margin: 20px auto 0;
      padding: 15px 30px;
      background: #d6336c;
      color: white;
      border: none;
      border-radius: 30px;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .smash-button:active {
      transform: scale(0.9);
    }

    .face {
      font-size: 50px;
      text-align: center;
      margin-top: 20px;
      transition: transform 0.2s ease;
    }

    .smash {
      animation: shake 0.4s;
    }

    @keyframes shake {
      0% { transform: rotate(0deg); }
      25% { transform: rotate(15deg); }
      50% { transform: rotate(-15deg); }
      75% { transform: rotate(10deg); }
      100% { transform: rotate(0deg); }
    }

    .floating {
      position: fixed;
      bottom: -50px;
      color: #ff69b4;
      font-size: 20px;
      animation: floatUp 5s linear infinite;
      pointer-events: none;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) translateX(0); opacity: 1; }
      100% { transform: translateY(-800px) translateX(50px); opacity: 0; }
    }
  </style>
</head>
<body>
  <h1>💕 Mood Tracker 💕</h1>
  <div class="container">
    <label for="mood">Rate Your Mood (1-10):</label>
    <input type="range" min="1" max="10" id="mood" />

    <label for="description">Describe Your Mood:</label>
    <textarea id="description" placeholder="Why do you feel this way?"></textarea>

    <button class="smash-button" onclick="smashFace()">Smash Face</button>

    <div class="face" id="face">😐</div>
  </div>

  <script>
    const face = document.getElementById("face");
    const mood = document.getElementById("mood");

    mood.addEventListener("input", () => {
      const val = parseInt(mood.value);
      if (val <= 3) face.textContent = "😢";
      else if (val <= 6) face.textContent = "😐";
      else if (val <= 8) face.textContent = "🙂";
      else face.textContent = "😁";
    });

    function smashFace() {
      face.classList.add("smash");
      setTimeout(() => face.classList.remove("smash"), 500);
    }

    const messages = ["💖", "❤️", "I love you", "I'm sorry", "💓", "💕", "💘"];
    
    function createFloating() {
      const el = document.createElement("div");
      el.className = "floating";
      el.style.left = Math.random() * window.innerWidth + "px";
      el.style.fontSize = (20 + Math.random() * 20) + "px";
      el.textContent = messages[Math.floor(Math.random() * messages.length)];
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 5000);
    }

    setInterval(createFloating, 800);
  </script>
</body>
</html>
